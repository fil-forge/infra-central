# Starts infra-nodes' end-to-end test on the nodes of one stage, after this
# repository deployed to it. The test creates a tenant through Hilt, stores two
# objects on each node and reads them back, so it covers the write path through
# central that the smoke test here does not.
#
# Check and deploy calls this after a push to main, once the stage has passed
# its smoke test: dev after smoke-dev, staging after smoke-staging. The run in
# infra-nodes alerts on its own, and its alert names the commit passed here.
# This job only fails when GitHub refuses the dispatch, and Check and deploy's
# alert reports that.
#
# Promotion does not wait for the test, which runs in infra-nodes.
name: Start node end-to-end test

on:
  workflow_call:
    inputs:
      stage:
        description: Stage that was deployed, dev or staging
        type: string
        required: true
    secrets:
      FORGE_BOT_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  start:
    name: Start the node end-to-end test on ${{ inputs.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GITHUB_TOKEN reaches only this repository. The fil-forge-bot token is
      # scoped to infra-nodes and to Actions, which is all a dispatch needs.
      - name: Mint fil-forge-bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # GitHub accepts the numeric App ID wherever it asks for the client ID.
          client-id: ${{ vars.FORGE_BOT_APP_ID }}
          private-key: ${{ secrets.FORGE_BOT_PRIVATE_KEY }}
          owner: fil-forge
          repositories: infra-nodes
          permission-actions: write

      # e2e.yml runs on main only: its partner key lives in Environments that
      # admit no other branch. change_* name this commit in the test's alert.
      # Under workflow_call the event and the actor are the caller's push.
      - name: Dispatch e2e.yml in infra-nodes
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          STAGE: ${{ inputs.stage }}
          MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          subject=${MESSAGE%%$'\n'*}
          gh workflow run e2e.yml --repo fil-forge/infra-nodes --ref main \
            -f "stage=$STAGE" -f change_repo=infra-central -f "change_sha=$COMMIT" \
            -f "change_subject=$subject" -f "change_author=$ACTOR"
          echo "started the end-to-end test of $STAGE in fil-forge/infra-nodes"
