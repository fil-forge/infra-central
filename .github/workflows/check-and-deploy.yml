name: Check and deploy

# Every pull request is checked and planned; every push to main is checked and
# applied. Both halves live in one workflow because `make check` belongs in the
# same dependency graph as the deploy: a change that fails gofmt should never
# reach AWS.
on:
  pull_request:
  push:
    branches: [main]
  # Runs plan-grafana and nothing else. Every other job below is gated on
  # pull_request or push, so a dispatch wakes only `check` and that one.
  workflow_dispatch:

# Serializes whole runs per ref. Two merges to main must not apply at once — they
# would contend for the state lock and one would fail halfway — and a force-push
# to a pull request should not leave two plans racing either.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# The deploy jobs below differ only in root, command and role. The two plans are a
# matrix; the two applies cannot be, because each apps job needs its platform
# job and a matrix has no way to make one instance wait on another. What would
# otherwise drift between the two apply copies is hoisted here.
env:
  # Pinned rather than latest. What deploys must not change because a new release
  # landed between two merges.
  TOFU_VERSION: 1.12.5
  # Pinned for the same reason as the tofu version: a shellcheck release that
  # adds a check would otherwise start failing merges that had nothing to do
  # with it. The runner image ships 0.9.0, older than the current brew build.
  SHELLCHECK_VERSION: 0.11.0
  AWS_REGION: us-east-2
  # Describes infrastructure and reads no data, because a pull request chooses
  # what the plan jobs run. See modules/github-actions-iam.
  PLAN_ROLE: arn:aws:iam::654654381893:role/forge-central-ci-plan
  APPLY_ROLE: arn:aws:iam::654654381893:role/forge-central-ci-apply
  # Where `tofu init` keeps downloaded providers, saved between runs by
  # actions/cache in every job that runs it. The registry serves providers
  # straight from GitHub Releases, and GitHub throttles unauthenticated downloads
  # from the shared runner IPs: a bad minute fails `tofu init` three attempts in
  # a row, and on 2026-09-14 it turned infra-nodes' main red for a commit that
  # had passed as a pull request nine minutes earlier. With the cache, the
  # download happens only when a lock file changes.
  #
  # An absolute path built from the workspace: tofu does not expand `~` in this
  # variable. The CLI checks the directory exists on every command, so every job
  # that runs tofu creates it first: `tofu init` fails without it, and `tofu fmt`
  # prints a CLI configuration error and carries on.
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tofu-plugin-cache

jobs:
  # gofmt, go vet, go test, tofu fmt and shellcheck. No AWS credentials:
  # everything in `make check` runs offline against no deployed stage, which is
  # what lets it gate the jobs that do have credentials.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      # Into RUNNER_TEMP rather than /usr/local/bin, which needs sudo. The release
      # publishes no checksum file.
      - name: install shellcheck
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -f - -C "$RUNNER_TEMP" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
          # GITHUB_PATH applies to later steps, so a bare `shellcheck` here
          # would report the runner image's 0.9.0 instead.
          "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" --version

      # tofu fmt reads no providers, but it still validates TF_PLUGIN_CACHE_DIR
      # and prints "The specified plugin cache dir ... cannot be opened" when the
      # directory is missing. The exit code is still 0, so this is only about
      # keeping that error out of the log of the one job everything else waits on.
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - run: make check

  # Both roots are planned at once, because neither can see the other's proposed
  # changes anyway: apps reads the *last applied* platform state through
  # terraform_remote_state, not this pull request's platform plan. A pull request
  # that changes a platform output apps consumes therefore shows its real apps
  # plan only after platform applies. Working around that would mean planning
  # apps against a platform plan that has not been applied and may never be,
  # which is a worse thing to show a reviewer than a slightly stale one.
  #
  # Skipped for pull requests from forks, which get no OIDC token and therefore
  # cannot assume the plan role. A fork's pull request cannot satisfy the branch
  # protection rule either, since a skipped job reports no status at all and a
  # required check that never reports never passes. Nothing opens one today.
  #
  # Dependabot's are not skipped. GitHub runs them "as if they were opened from a
  # repository fork", but the branch is in this repository and the run honours
  # the `permissions` block below, so the job gets its OIDC token and mints the
  # same `:pull_request` subject claim any other pull request does. The plan
  # role's trust policy needs nothing added for it.
  #
  # What that accepts: a bump to an action pin runs the bumped action holding the
  # plan role's credentials, before anyone has reviewed the bump, and a
  # compromised upstream release is exactly the pull request Dependabot would
  # open. Those credentials reach no data — the plan role describes
  # infrastructure and reads nothing, no Secrets Manager, no object outside the
  # state keys, and the state carries no password because RDS keeps the master
  # one in Secrets Manager. The same exposure is already open to anyone with push
  # Whether the plan jobs below have anything to plan.
  #
  # The note above apply-dev-platform rules out filtering the deploy jobs by
  # path, and it is right: an allow-list has to name every module a root depends
  # on, and a module added without a matching entry silently stops being
  # deployed. Silence is the worst failure a deploy pipeline can have.
  #
  # This is the inverse, and only for the pull-request plans. It names paths that
  # provably cannot affect any stage root, and skips the plans only when a pull
  # request touches nothing else. A new module is not on the list, so it is never
  # skipped; the way to be wrong here is to plan when you need not, which costs a
  # minute. Adding a path is a deliberate act with this comment next to it.
  #
  # Worth doing because the four plans are not merely slow on an unrelated pull
  # request: they contend for the same S3 state locks, and two pushes close
  # together have twice failed a plan outright with a 412 on the lock object.
  #
  # The applies are untouched. A push to main plans and applies everything, as
  # before.
  scope:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    outputs:
      plan-needed: ${{ steps.decide.outputs.plan-needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both sides of the comparison have to be present, and a shallow clone
          # has neither merge base nor base branch.
          fetch-depth: 0

      # Paths that cannot change what a stage root plans. Anything not matched
      # here counts as relevant, including a path nobody thought about.
      #
      #   terraform/envs/grafana/  its own root, applied by hand, not in the
      #                            plan matrix at all
      #   docs/ and *.md           prose
      #
      # .github/ is deliberately absent: a change to this workflow changes how
      # the plans run, so it re-runs them.
      - id: decide
        run: |
          # base.sha over a named branch: actions/checkout leaves no local ref
          # for the base branch, but the merge ref it does check out has the
          # base commit as an ancestor, so the sha is always resolvable.
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          echo "changed files:"
          echo "$changed" | sed 's/^/  /'

          relevant=$(printf '%s\n' "$changed" \
            | grep -v '^terraform/envs/grafana/' \
            | grep -v '^docs/' \
            | grep -v '\.md$' \
            | grep -v '^[[:space:]]*$' || true)

          if [ -z "$relevant" ]; then
            echo "plan-needed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing outside the ignored paths changed; the stage plans have nothing to do."
          else
            echo "plan-needed=true" >> "$GITHUB_OUTPUT"
            echo "Relevant changes:"
            echo "$relevant" | sed 's/^/  /'
          fi

  # access, who writes the workflow file their own pull request runs. See
  # modules/github-actions-iam.
  plan:
    # Set explicitly, so the four instances report as `plan-dev-platform`,
    # `plan-dev-apps`, `plan-staging-platform` and `plan-staging-apps` rather than
    # GitHub's default `plan (dev/platform)`. A branch protection rule has to
    # name its required checks literally, and the flat names are the ones worth
    # typing.
    name: plan-${{ matrix.name }}
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [check, scope]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to request the OIDC token the role is assumed with. Without it
      # the credentials step fails with a token error rather than a permissions
      # one.
      id-token: write
    strategy:
      # One root's plan failing should not cancel the other's: a reviewer wants
      # both results, not the first failure.
      fail-fast: false
      matrix:
        include:
          - name: dev-platform
            root: dev/platform
          - name: dev-apps
            root: dev/apps
          - name: staging-platform
            root: staging/platform
          - name: staging-apps
            root: staging/apps
    defaults:
      run:
        working-directory: terraform/envs/${{ matrix.root }}
    # The job runs either way and the steps are what `scope` gates, rather than
    # the job being skipped outright. These four names are required checks on
    # main; a job that never runs leaves its check pending forever and the pull
    # request cannot merge. Running to a no-op takes about ten seconds, reports
    # success under the name branch protection is looking for, and -- the point
    # of the exercise -- never touches the state lock.
    steps:
      # working-directory overridden: the job's default points into the checkout,
      # and the checkout is one of the steps being skipped.
      - if: needs.scope.outputs.plan-needed != 'true'
        working-directory: ${{ github.workspace }}
        run: echo "No change outside the ignored paths; see the scope job. Nothing to plan."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.plan-needed == 'true'

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: needs.scope.outputs.plan-needed == 'true'
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: needs.scope.outputs.plan-needed == 'true'
        with:
          role-to-assume: ${{ env.PLAN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      # Keyed on this root's own lock file rather than on all of them. actions/cache
      # saves only on a miss, so one key shared by every root would be saved by
      # whichever job finished first and stay frozen with that root's provider
      # version if the roots ever resolved different ones, as staging did until
      # 2026-09-14. Today every lock file is byte-identical and the five jobs
      # share one entry; the per-root key costs nothing while that holds.
      - if: needs.scope.outputs.plan-needed == 'true'
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.scope.outputs.plan-needed == 'true'
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tofu-providers-${{ hashFiles(format('terraform/envs/{0}/.terraform.lock.hcl', matrix.root)) }}

      - if: needs.scope.outputs.plan-needed == 'true'
        run: tofu init -input=false

      # A lock timeout rather than failing the moment the lock is held: the state
      # lock is an S3 object, and one left behind by a killed run is worth
      # waiting on briefly before a human gets involved.
      - if: needs.scope.outputs.plan-needed == 'true'
        run: tofu plan -input=false -lock-timeout=5m

  # A plan of terraform/envs/grafana, on demand, printed where a person can read
  # it. That root is not in the matrix above: it belongs to no stage, so there is
  # no stage whose pull request should plan it.
  #
  # workflow_dispatch rather than pull_request, and the distinction is the whole
  # design. The note above `plan` sets out what this repository accepts for
  # pull-request credentials: "Those credentials reach no data -- the plan role
  # describes infrastructure and reads nothing". A Grafana token cannot make that
  # promise. Planning this root refreshes grafana_folder_permission, which calls
  # folders.permissions:read, and that action is Admin-only -- FolderAdminActions
  # is FolderEditActions plus folders.permissions:read and :write, so no
  # View- or Edit-level token can plan here. The token that plans can also write.
  #
  # On pull_request that token would be held by every Dependabot action bump
  # before anyone reviewed it, which is exactly the scenario that note calls
  # acceptable only because the credential is inert. On workflow_dispatch it is
  # held by a job someone with write access deliberately started. Do not "fix"
  # this into a pull_request trigger.
  #
  # Two prerequisites, the same ones apply-grafana has: the GRAFANA_TERRAFORM_TOKEN
  # secret, and "grafana" in the account bootstrap root's state_key_prefixes so
  # the plan role can read grafana/forge.tfstate. Without the second this fails at
  # `tofu init` with an access denial, which is the right way for a job someone
  # asked for by hand to tell them something is missing.
  plan-grafana:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/envs/grafana
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.PLAN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-grafana-${{ github.run_id }}

      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tofu-providers-${{ hashFiles('terraform/envs/grafana/.terraform.lock.hcl') }}

      - run: tofu init -input=false

      # -out, so the summary below reads the same plan the log shows rather than
      # running a second one against a moving target.
      - name: tofu plan
        env:
          TF_VAR_grafana_auth: ${{ secrets.GRAFANA_TERRAFORM_TOKEN }}
        run: tofu plan -input=false -lock-timeout=5m -no-color -out=tfplan

      # The full plan is in the log above, but the two dashboards are megabytes of
      # embedded JSON and scrolling past them to find the verbs is miserable. This
      # puts the verbs, and only the verbs, on the run's summary page.
      #
      # always(), so a plan that fails still leaves the step summary saying so
      # rather than an empty page.
      - name: Summarise the plan
        if: always()
        env:
          TF_VAR_grafana_auth: ${{ secrets.GRAFANA_TERRAFORM_TOKEN }}
        run: |
          if [ ! -f tfplan ]; then
            echo "### Grafana plan failed before producing a plan file" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "See the \`tofu plan\` step above." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tofu show -json tfplan > tfplan.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections, os
          d = json.load(open("tfplan.json"))
          rows, counts = [], collections.Counter()
          for c in d.get("resource_changes", []):
              acts = c["change"]["actions"]
              if acts == ["no-op"]:
                  continue
              verb = {("create",): "create", ("delete",): "DESTROY",
                      ("update",): "update", ("delete", "create"): "REPLACE",
                      ("create", "delete"): "REPLACE"}.get(tuple(acts), "/".join(acts))
              counts[verb] += 1
              rows.append((verb, c["address"]))
          print(f"### Grafana plan — `{os.environ.get('GITHUB_REF_NAME','?')}`")
          print()
          print(", ".join(f"**{n} to {v}**" for v, n in sorted(counts.items())) or "**no changes**")
          print()
          if counts.get("DESTROY") or counts.get("REPLACE"):
              print("> This plan destroys or replaces something. On a first plan that is wrong.")
              print()
          print("| | Resource |")
          print("| --- | --- |")
          for verb, addr in sorted(rows, key=lambda r: r[1]):
              print(f"| `{verb}` | `{addr}` |")
          PY

  # apply-dev-apps waits for apply-dev-platform because apps reads platform's
  # state and must not plan against outputs an in-flight platform apply is about
  # to change.
  #
  # Both run on every push, even one that touched only apps. Filtering by path
  # would skip the untouched root, but every such filter has to name the modules
  # the root depends on as well as the root itself, and a module added without a
  # matching filter silently stops being deployed. An extra empty plan costs about
  # a minute and removes that failure mode.
  apply-dev-platform:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/envs/dev/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.APPLY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-${{ github.run_id }}

      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tofu-providers-${{ hashFiles('terraform/envs/dev/platform/.terraform.lock.hcl') }}

      - run: tofu init -input=false

      # -auto-approve, and the log is the audit trail: apply prints the whole plan
      # to stdout before it changes anything, so the run shows exactly what it
      # did. dev deploys on merge, which is the point; a gated apply is what prod
      # will want instead.
      - run: tofu apply -auto-approve -input=false -lock-timeout=5m

  apply-dev-apps:
    if: github.event_name == 'push'
    needs: apply-dev-platform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/envs/dev/apps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.APPLY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-${{ github.run_id }}

      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tofu-providers-${{ hashFiles('terraform/envs/dev/apps/.terraform.lock.hcl') }}

      - run: tofu init -input=false

      - run: tofu apply -auto-approve -input=false -lock-timeout=5m

      # apply returns once AWS accepted the change: for an ECS service that means
      # a new task definition was registered. A rolling update keeps the old task
      # answering until the new one passes its health check, so without this wait
      # the smoke test below can pass against the revision this push replaced and
      # a deploy whose new task never starts still goes green.
      #
      # Every service in the cluster, listed rather than named, so a service added
      # to the apps root is waited on without this step being edited. That covers
      # openbao too, which the platform apply above rolls out.
      #
      # Twenty minutes rather than the ten `aws ecs wait services-stable` allows
      # and will not let anyone change. The first deploy that gives a service a
      # public hostname is the slow one: the new task has to start, wait out its
      # ninety-second health check grace period and pass two ALB checks thirty
      # seconds apart before the old one drains, and on 2026-08-31 plc ran past
      # ten minutes doing exactly that. The stage was healthy; the run was red.
      #
      # No deployment circuit breaker is configured, so a task that never becomes
      # healthy leaves the deployment unstable rather than being rolled back. The
      # script names the services still moving, and every two minutes prints their
      # counts, deployments and ECS events, which is the part CloudWatch cannot
      # show: an application that never started writes no logs.
      - name: wait for every service to reach steady state
        timeout-minutes: 25
        # An absolute path because this job's working directory is the apps root,
        # where `tofu output` has to run.
        run: |
          "$GITHUB_WORKSPACE/scripts/wait-services-stable.sh" "$(tofu output -raw cluster_arn)"

  # Staging follows the same ordered deployment as dev, but keeps independent
  # state so either environment can be planned and repaired on its own.
  apply-staging-platform:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/envs/staging/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.APPLY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-staging-${{ github.run_id }}

      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tofu-providers-${{ hashFiles('terraform/envs/staging/platform/.terraform.lock.hcl') }}

      - run: tofu init -input=false

      - run: tofu apply -auto-approve -input=false -lock-timeout=5m

  apply-staging-apps:
    if: github.event_name == 'push'
    needs: apply-staging-platform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/envs/staging/apps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.APPLY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-staging-${{ github.run_id }}

      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tofu-providers-${{ hashFiles('terraform/envs/staging/apps/.terraform.lock.hcl') }}

      - run: tofu init -input=false

      - run: tofu apply -auto-approve -input=false -lock-timeout=5m

      - name: wait for every service to reach steady state
        timeout-minutes: 25
        run: |
          "$GITHUB_WORKSPACE/scripts/wait-services-stable.sh" "$(tofu output -raw cluster_arn)"

  # The check the applies cannot make: that the stage answers from the outside.
  # A service reaching steady state says its task passes its own container health
  # check; it says nothing about the Route53 record, the certificate or the
  # listener rule in front of it.
  #
  # No AWS credentials and no OIDC token: every check goes over public HTTPS, and
  # the hostnames come from the stage's committed terraform.tfvars. curl, jq and
  # make are already on the runner.
  smoke-dev:
    if: github.event_name == 'push'
    needs: apply-dev-apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Retried anyway, because steady state is not the whole ingress path. A
      # newly created Route53 record or listener rule takes a moment longer than
      # the task behind it, and DNS on the runner is not warm.
      #
      # Four minutes of retries and then a failure. A stage still unreachable
      # after four minutes is broken, and the alert should fire.
      - name: make smoke STAGE=dev
        run: |
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              echo "=== attempt $attempt of 5, after 60s ==="
              sleep 60
            fi
            if make smoke STAGE=dev; then
              exit 0
            fi
          done
          echo "the dev stage did not come up: 5 attempts over 4 minutes" >&2
          exit 1

  smoke-staging:
    if: github.event_name == 'push'
    needs: apply-staging-apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: make smoke STAGE=staging
        run: |
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              echo "=== attempt $attempt of 5, after 60s ==="
              sleep 60
            fi
            if make smoke STAGE=staging; then
              exit 0
            fi
          done
          echo "the staging stage did not come up: 5 attempts over 4 minutes" >&2
          exit 1

  # The stage's own logs, printed into the run when a deploy fails, so the
  # diagnosis is in the run the alert links to rather than in the console.
  # scripts/tail-logs.sh discovers the log groups from CloudWatch, so a service
  # added to either root is covered without this job being edited.
  #
  # apply-dev-apps and smoke-dev are the two jobs whose failure means the stage
  # did not come up: the wait for steady state is the last step of the first,
  # and the smoke test is the whole of the second. A failed apply-dev-platform
  # skips both rather than failing them, and a skipped job is not a failure, so
  # nothing fires for it.
  #
  # It runs on the apply role, because reading log events needs
  # logs:FilterLogEvents and the plan role deliberately has none of it: it may
  # describe infrastructure and read no data. Using it here widens nothing. The
  # same role applied the stage two jobs earlier, and it is reachable only from
  # refs/heads/main.
  diagnose:
    if: failure() && github.event_name == 'push'
    needs: [apply-dev-apps, smoke-dev]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.APPLY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-diagnose-${{ github.run_id }}

      # Forty-five minutes covers the whole run: twenty waiting for steady state,
      # four of smoke-test retries, and the applies before them. Fifty lines per
      # service rather than the script's default ten, because this is the only
      # look anyone gets before opening the console.
      - run: scripts/tail-logs.sh dev --since 45m --lines 50

  diagnose-staging:
    if: failure() && github.event_name == 'push'
    needs: [apply-staging-apps, smoke-staging]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.APPLY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-diagnose-staging-${{ github.run_id }}

      - run: scripts/tail-logs.sh staging --since 45m --lines 50

  # One job for the whole workflow rather than a notification step in each: a
  # failed apply and a failed smoke test want the same message, and `failure()`
  # is true here when anything above it failed. A job skipped because the run is
  # a pull request does not count as a failure, so a green pull request run
  # announces nothing.
  #
  # Only pushes are announced. A pull request's author already sees a red check
  # on the pull request, and a shared alert channel that fires on every failed
  # check stops being read.
  notify-failure:
    if: failure() && github.event_name == 'push'
    needs:
      - check
      - apply-dev-platform
      - apply-dev-apps
      - smoke-dev
      - apply-staging-platform
      - apply-staging-apps
      - smoke-staging
    runs-on: ubuntu-latest
    steps:
      # Only for the commit subject below. github.event.head_commit.message
      # would save the checkout, but it is the whole message, newlines included.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: commit
        run: echo "subject=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      # A bump commit says which service image changed and nothing about what
      # changed inside it, so the alert names a digest nobody recognises. Bump
      # deployed image writes the source commit into the body as a link, and
      # that line is what this reads: matching it is the actual precondition for
      # the lookup, stricter than checking the actor and the subject prefix.
      #
      # Every publisher repository is public, so GITHUB_TOKEN reads it and no
      # app token has to be minted on the failure path.
      #
      # The whole step is best-effort. A rename, a deleted repository or a rate
      # limit must not swallow the alert, so every failure leaves the output
      # empty and the message below falls back to the infra-central commit
      # alone.
      - id: source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          body=$(git log -1 --format=%B)
          line=$(printf '%s\n' "$body" \
            | grep -oE '^- Commit: https://github\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+/commit/[0-9a-f]{40}$' \
            | head -1) || true
          if [ -z "$line" ]; then
            echo "no source commit link in the commit body"
            exit 0
          fi

          line_url=${line#- Commit: }
          path=${line_url#https://github.com/}
          repo=${path%/commit/*}
          sha=${path##*/commit/}

          json=$(gh api "repos/$repo/commits/$sha") || {
            echo "::warning::could not read $repo@${sha:0:7}"
            exit 0
          }

          # First line only: GITHUB_OUTPUT reads a newline as the end of the
          # value and the rest as further outputs.
          subject=$(printf '%s' "$json" | jq -r '.commit.message | split("\n")[0]')
          # login is null when the commit email belongs to no GitHub account, so
          # the git author name stands in and links no profile.
          login=$(printf '%s' "$json" | jq -r '.author.login // ""')
          if [ -n "$login" ]; then
            author="<https://github.com/$login|@$login>"
          else
            author=$(printf '%s' "$json" | jq -r '.commit.author.name // "an unknown author"')
          fi

          # The finished Slack line rather than its parts, so the payload below
          # interpolates one value and needs no markup of its own.
          echo "line=Service commit: \`$subject\` by $author (<$line_url|$repo@${sha:0:7}>)" \
            >> "$GITHUB_OUTPUT"

      # Every interpolation goes through toJSON, because the payload is JSON and
      # a commit subject is free to contain a quote or a backslash.
      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "filone-alerts",
              "text": ${{ toJSON(format('Deploy of `{0}` failed. Commit: {1} by @{2}. {3}Details: {4}/{5}/actions/runs/{6}', github.event.repository.name, steps.commit.outputs.subject, github.actor, steps.source.outputs.line && format('{0}. ', steps.source.outputs.line) || '', github.server_url, github.repository, github.run_id)) }},
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(format(':warning: *Deploy of `{0}` failed* · <{1}/{2}/actions/runs/{3}|Details>', github.event.repository.name, github.server_url, github.repository, github.run_id)) }}
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(format('Commit: `{0}` by <https://github.com/{1}|@{1}>', steps.commit.outputs.subject, github.actor)) }}
                  }
                }
                ${{ steps.source.outputs.line && format(',{{"type":"section","text":{{"type":"mrkdwn","text":{0}}}}}', toJSON(steps.source.outputs.line)) || '' }}
              ]
            }
