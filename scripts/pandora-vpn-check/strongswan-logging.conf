# charon-systemd logs to the journal by default, and a container has none.
# Log to stderr instead, so `docker logs` shows the IKE exchange.
charon-systemd {
  journal {
    default = -1
  }
  filelog {
    stderr {
      default = 1
      ike = 2
      time_format = %b %e %T
    }
  }
}

charon {
  # Each child carries an interface ID, so traffic reaches the tunnel only
  # through its xfrm interface. Routes are set by strongswan-entrypoint.sh, and
  # charon's own would send the container's other traffic into table 220.
  install_routes = no
}
